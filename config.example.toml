# openbrep Configuration Example
# Copy this to config.toml and fill in your own API keys and paths

[llm]
# 当前模型：写模型 id（命中某个 provider 的 models 列表），
# 或写 provider/model 显式引用（如 "opencode-go/deepseek-v4-flash"）。
model = "glm-4-flash"
temperature = 0.2
max_tokens = 16384

# 可选：透传给 LLM 的额外请求体字段（如 DeepSeek 关闭思考模式）。
# 注意：benchmark 黄金语料录制会强制 thinking disabled，不依赖此配置。
# extra_body = { thinking = { type = "disabled" } }

# 可选：长期保存的 AI 协作上下文。
# 可填写你的 GDL 经验、当前使用场景、沟通偏好、改动边界等；修改后会立即影响后续聊天与生成。
# assistant_settings = "我是 GDL 初学者，请先解释再给最小修改。"

# 可选（ChatGPT Codex 订阅模型专用）：Fixed 模式的 reasoning effort（推理强度）。
# 值必须来自当前 ChatGPT 账户 model/list 的 supportedReasoningEfforts（如 low/medium/high），
# 由 AI 设置面板显式保存；运行时严格使用该组合，不自动升级/降级，也不切换模型。
# 留空 = 不覆盖（使用模型默认）。非 codex 模型一律忽略该字段。
# reasoning_effort = "medium"

# ── 统一 Provider 注册表（推荐）──────────────────────────────
# 每个 [[llm.providers]] = 一个 API 端点 + 它的模型列表，官方/自定义同一套机制。
#   name:    provider 名（用于 provider/model 显式引用与按名匹配）
#   api:     OpenAI/Anthropic 兼容端点（不要带 /chat/completions，会自动补）
#   api_mode: chat_completions（OpenAI 兼容，默认）/ anthropic_messages /
#            responses（OpenAI Responses API，/v1/responses；适合 gpt-5 系、
#            codex 系等走 API-key 的官方模型）
#   api_key: 明文 Key，或 "${ENV_VAR}" 引用环境变量（避免明文落盘）
#   default_model: 用 provider 名当模型时的默认模型（可选）
#   models:  模型 id 列表；也支持 { alias = "别名", model = "真实模型id" }
#
# OpenCode Go 示例：
# [[llm.providers]]
# name = "opencode-go"
# api = "https://opencode.ai/zen/go/v1"
# api_mode = "chat_completions"
# api_key = "${OPENCODE_GO_KEY}"        # 或直接写 "sk-..."
# default_model = "deepseek-v4-flash"
# models = ["deepseek-v4-flash", "kimi-k3", "glm-5.2"]
#
# 自定义 OpenAI 兼容代理示例：
# [[llm.providers]]
# name = "openai-proxy"
# api = "https://your-proxy.com/v1"
# api_key = "your-proxy-key"
# models = ["gpt-5.4"]
#
# Anthropic 协议端点示例：
# [[llm.providers]]
# name = "openmodel"
# api = "https://api.openmodel.ai/v1"
# api_mode = "anthropic_messages"
# api_key = "${OPENMODEL_API_KEY}"
# models = ["deepseek-v4-flash"]
#
# OpenAI Responses API 示例（gpt-5 系 / codex API 模型推荐）：
# [[llm.providers]]
# name = "openai-responses"
# api = "https://api.openai.com/v1"
# api_mode = "responses"
# api_key = "${OPENAI_API_KEY}"
# models = ["gpt-5.4"]

# ── 官方 provider 快捷方式（可选，兼容旧配置）─────────────────
# 内置官方模型（glm-* / deepseek-* / claude-* / gpt-* / qwen-* / moonshot-* /
# gemini/* / ollama/*）可以只在这里填 Key，端点走官方默认。
# 免费模型：glm-4-flash 只需 API Key，无需充值。
[llm.provider_keys]
zhipu     = "YOUR_ZHIPU_API_KEY"       # glm-*        https://bigmodel.cn/usercenter/apikeys
deepseek  = "YOUR_DEEPSEEK_API_KEY"    # deepseek-*   https://platform.deepseek.com/api_keys
anthropic = "YOUR_ANTHROPIC_API_KEY"   # claude-*     https://console.anthropic.com/settings/keys
openai    = "YOUR_OPENAI_API_KEY"      # gpt-*, o3    https://platform.openai.com/api-keys
google    = "YOUR_GOOGLE_API_KEY"      # gemini-*     https://aistudio.google.com/apikey
aliyun    = "YOUR_DASHSCOPE_API_KEY"   # qwen-*, qwq  https://dashscope.console.aliyun.com
kimi      = "YOUR_KIMI_API_KEY"        # moonshot-*   https://platform.moonshot.cn/console/api-keys

[agent]
max_iterations = 5
validate_xml = true
diff_check = true
auto_version = true

[compiler]
# 编译模式：mock 或 lp
mode = "mock"
# LP_XMLConverter 路径（配置一次永久生效）
# macOS:   /Applications/GRAPHISOFT/Archicad 29/Archicad 29.app/Contents/MacOS/LP_XMLConverter.app/Contents/MacOS/LP_XMLConverter
# Windows: C:\Program Files\GRAPHISOFT\ArchiCAD 29\LP_XMLConverter.exe
# 留空 → 启动时自动探测；探测不到则编译验证干净跳过（SKIPPED_NO_COMPILER）。
# 不要填占位路径：非空路径会触发真实编译调用，占位路径只会让编译失败。
path = ""
timeout = 60

[revisions]
# 自动 prune 保留的最新快照数（默认 20，保持现状行为）。
# 0 = 禁用自动 prune：git 化项目把历史完全交给 git，快照只作自动检查点（不进 git）。
# 非法值（负数/非整数）自动回退默认 20。
keep_last_n = 20

[vision]
# Vision Harness（P5b）：提取后原图是否随生成调用双通道发送。
# on  → 多图生成只带 role ∈ {outline, pattern, auto} 的图（material 只参与提取）；
# off → 生成不带原图，只靠 ModelingPlan hint。单图旧路径不受此开关影响。
pass_raw_image = true

# Vision Harness（P5c）：S3 critic 校验开关（默认 on，设计 D3）。
# on  → CREATE/IMAGE + schema 声明 critic_checks 时，每图一次 critic 复读核对
#       必核字段（"不匹配+依据"改值并留痕，"无法判断"标 low）；
# off → 不跑 critic（MODIFY 简化档本就永远不跑，见 harness）。
critic_pass = true

[paths]
knowledge_dir = "./knowledge"
templates_dir = "./templates"
src_dir = "./src"
output_dir = "./output"

# 上次打开的工作区目录（open 时自动写入；restore 时静默附着，失效则降级独立项目模式）。
# 留空 = 不自动附着工作区。
# last_workspace = "/path/to/workspace"
