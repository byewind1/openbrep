name: Release Tauri Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: OpenBrep-macOS
          - os: windows-latest
            artifact-name: OpenBrep-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Python dependencies
        run: pip install -e "." pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (sidecar 内嵌静态资源)
        working-directory: frontend
        run: npm run build

      - name: Freeze Python backend (PyInstaller onefile sidecar)
        run: pyinstaller --clean --noconfirm openbrep-backend.spec

      # 冒烟：冻结后端必须能独立启动并服务 API + 前端（无需系统 Python 环境）
      - name: Smoke-test frozen backend (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/obr7-backend --tauri --no-open &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/snapshot > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/snapshot > /dev/null
          curl -sf http://127.0.0.1:8765/ | grep -qi "<title\|<div id=\"root\""

      - name: Smoke-test frozen backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ./dist/obr7-backend.exe -ArgumentList '--tauri','--no-open' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..60) {
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/snapshot' -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $ok) { throw 'frozen backend did not respond on /api/snapshot' }
            $html = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 5
            if ($html.Content -notmatch '<div id="root"') { throw 'frontend index.html not served' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Stage sidecar for Tauri externalBin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TRIPLE='${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}'
          if [ '${{ runner.os }}' = 'Windows' ]; then SRC=dist/obr7-backend.exe; else SRC=dist/obr7-backend; fi
          cp "$SRC" "src-tauri/binaries/obr7-backend-${TRIPLE}${EXE_EXT}"
          ls -la src-tauri/binaries/
        env:
          EXE_EXT: ${{ runner.os == 'Windows' && '.exe' || '' }}

      # 纯构建：不传 tagName/releaseName/GITHUB_TOKEN —— 绝不在秘密门禁
      # 通过前创建或上传任何 GitHub Release（上传由下方 publish-release 负责）。
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          # Set before Tauri CLI so vite.config.ts picks up VITE_IS_TAURI=true
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
        with:
          projectPath: '.'
          tauriScript: 'npx @tauri-apps/cli@2'

      # 发布秘密门禁：任何 upload-artifact / Release 上传之前执行。
      - name: Secret gate on Tauri bundle
        run: |
          python scripts/secret_scan.py --tree frontend/dist --report text
          python scripts/secret_scan.py --tree src-tauri/target/release/bundle --report text

      # Windows：Tauri 产物是 .msi / NSIS .exe（压缩二进制），tree 级原始字节
      # 扫描不足以覆盖压缩内容 —— 用 7-Zip 展开后再做内容级门禁（fail closed）。
      - name: Extract and gate Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found at $sevenZip" }
          $staging = Join-Path $env:RUNNER_TEMP 'installer-extracted'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $installers = Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.msi', '.exe') }
          foreach ($inst in $installers) {
            Write-Host "Extracting $($inst.FullName)"
            & $sevenZip x $inst.FullName ("-o" + $staging) -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction failed for $($inst.FullName)" }
          }
          python scripts/secret_scan.py --tree $staging --report text

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG_NAME" release/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "OpenBrep $TAG_NAME" \
              --generate-notes \
              --draft
          fi
